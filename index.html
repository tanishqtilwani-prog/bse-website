<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Markets Live — BSE/NSE Results & Alerts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --card: #FFFFFF;
    --border: #E0E0E0;
    --accent: #000000;
    --accent2: #000000;
    --red: #C0392B;
    --text: #000000;
    --muted: #444444;
    --tag-bg: #F5F5F5;
    --header-bg: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--header-bg);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #000000;
  }

  .logo-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: #000000;
    margin-left: 10px;
    font-weight: 400;
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #000000;
    font-family: 'DM Mono', monospace;
    border: 1px solid #333328;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #000000;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 60px;
    z-index: 99;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
  }

  #search-input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--muted); }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,0,0,0.05); }

  .nifty-toggle {
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nifty-toggle.active {
    border-color: #000000;
    color: #000000;
    background: rgba(0,0,0,0.05);
  }

  .nifty-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  .main {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 24px;
  }

  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 10px 0;
  }

  .stats-text {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .refresh-btn {
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: 1px solid rgba(184,134,11,0.3);
    border-radius: 5px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    padding: 5px 10px;
    transition: all 0.15s;
  }

  .refresh-btn:hover { background: rgba(0,0,0,0.05); }

  .feed { display: flex; flex-direction: column; gap: 12px; }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    transition: box-shadow 0.15s, border-color 0.15s;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-card:hover {
    border-color: #CCCCCC;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .post-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 12px;
  }

  .company-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .post-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .post-time {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .scrip-code {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  .post-body {
    font-size: 13px;
    color: #000000;
    line-height: 1.65;
    margin-bottom: 14px;
  }

  .post-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .post-tags { display: flex; gap: 6px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .tag-result { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid #CCCCCC; }
  .tag-dividend { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid #CCCCCC; }
  .tag-bonus { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid #CCCCCC; }
  .tag-buyback { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid rgba(0,0,0,0.2); }
  .tag-order { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid rgba(0,0,0,0.2); }
  .tag-other { background: var(--tag-bg); color: var(--muted); border: 1px solid var(--border); }
  .tag-nifty { background: rgba(0,0,0,0.05); color: #000000; border: 1px solid rgba(0,0,0,0.2); }

  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center;
    padding: 80px 20px;
  }

  .empty h3 {
    font-family: 'Playfair Display', serif;
    color: var(--muted);
    font-size: 22px;
    margin-bottom: 8px;
  }

  .empty p { color: var(--muted); font-size: 13px; opacity: 0.7; }

  .error-bar {
    background: rgba(192,57,43,0.08);
    border: 1px solid rgba(192,57,43,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--red);
    font-family: 'DM Mono', monospace;
    margin-bottom: 16px;
  }

  .load-more {
    text-align: center;
    padding: 20px;
  }

  .load-more-btn {
    padding: 10px 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .load-more-btn:hover { border-color: var(--accent); color: var(--accent); }

  .highlight { background: rgba(184,134,11,0.15); border-radius: 2px; padding: 0 2px; }

  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .controls { padding: 12px 16px; }
    .main { padding: 16px; }
    .company-name { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <span class="logo">Market Pulse</span>
    <span class="logo-sub">BSE/NSE Results & Alerts</span>
  </div>
  <div class="live-pill">
    <div class="dot"></div>
    LIVE
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search company (e.g. Reliance, Infosys)..." autocomplete="off">
  </div>

  <div class="filter-group" id="cat-filters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="result">Results</button>
    <button class="filter-btn" data-cat="dividend">Dividend</button>
    <button class="filter-btn" data-cat="bonus">Bonus</button>
    <button class="filter-btn" data-cat="buyback">Buyback</button>
    <button class="filter-btn" data-cat="order_win">Orders</button>
  </div>

  <button class="nifty-toggle" id="nifty-toggle">
    <span class="nifty-dot"></span>
    Nifty 500 Only
  </button>
</div>

<div class="main">
  <div class="stats-bar">
    <span class="stats-text" id="stats-text">Loading...</span>
    <button class="refresh-btn" onclick="loadPosts(true)">↻ Refresh</button>
  </div>

  <div id="error-bar" style="display:none" class="error-bar"></div>
  <div class="feed" id="feed">
    <div class="loading"><div class="spinner"></div>Fetching latest announcements...</div>
  </div>
  <div class="load-more" id="load-more" style="display:none">
    <button class="load-more-btn" onclick="loadMore()">Load more</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kbklmidusxqkbjgpsdlg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtia2xtaWR1c3hxa2JqZ3BzZGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTU3MTcsImV4cCI6MjA5NTY5MTcxN30.D_zNYY3NX2we-hrfpPbB20iaNyrTKlIhYd6MX3LKJY4';

const PAGE_SIZE = 30;
let currentPage = 0;
let allLoaded = false;
let activeCategory = 'all';
let niftyOnly = false;
let searchQuery = '';
let searchTimer = null;

const CAT_LABELS = {
  result: 'Result', dividend: 'Dividend', bonus: 'Bonus',
  buyback: 'Buyback', order_win: 'Order Win', auditor: 'Auditor',
  agm: 'AGM', board_meeting: 'Board Meeting', other: 'Announcement'
};

const CAT_CLASSES = {
  result: 'tag-result', dividend: 'tag-dividend', bonus: 'tag-bonus',
  buyback: 'tag-buyback', order_win: 'tag-order', other: 'tag-other'
};

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if (diff < 172800) return 'Yesterday ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

function highlight(text, query) {
  if (!query || query.length < 2) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="highlight">$1</span>');
}

function renderCard(post) {
  const catClass = CAT_CLASSES[post.category] || 'tag-other';
  const catLabel = CAT_LABELS[post.category] || 'Announcement';
  const company = highlight(post.company_name || 'BSE Announcement', searchQuery);
  const body = highlight((post.body || '').substring(0, 280), searchQuery);

  return `
    <div class="post-card">
      <div class="post-header">
        <div>
          <div class="company-name">${company}</div>
          ${post.symbol ? `<div class="scrip-code">BSE: ${post.symbol}</div>` : ''}
        </div>
        <div class="post-meta">
          <span class="post-time">${formatTime(post.date)}</span>
        </div>
      </div>
      <div class="post-body">${body}${(post.body||'').length > 280 ? '...' : ''}</div>
      <div class="post-footer">
        <div class="post-tags">
          <span class="tag ${catClass}">${catLabel}</span>
          ${post.is_nifty500 ? '<span class="tag tag-nifty">Nifty 500</span>' : ''}
        </div>
      </div>
    </div>
  `;
}

async function fetchPosts(reset = false) {
  if (reset) {
    currentPage = 0;
    allLoaded = false;
  }

  const from = currentPage * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  let url = `${SUPABASE_URL}/rest/v1/posts?select=*&order=date.desc&limit=${PAGE_SIZE}&offset=${from}`;

  if (activeCategory !== 'all') url += `&category=eq.${activeCategory}`;
  if (niftyOnly) url += `&is_nifty500=eq.true`;
  if (searchQuery.length >= 2) {
    url += `&or=(company_name.ilike.*${encodeURIComponent(searchQuery)}*,body.ilike.*${encodeURIComponent(searchQuery)}*,symbol.ilike.*${encodeURIComponent(searchQuery)}*)`;
  }

  const resp = await fetch(url, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Range-Unit': 'items',
    }
  });

  if (!resp.ok) throw new Error(`Supabase error: ${resp.status}`);
  const posts = await resp.json();
  if (posts.length < PAGE_SIZE) allLoaded = true;
  return posts;
}

async function loadPosts(reset = false) {
  if (reset) {
    document.getElementById('feed').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    document.getElementById('load-more').style.display = 'none';
    document.getElementById('error-bar').style.display = 'none';
  }

  document.getElementById('stats-text').textContent = 'Loading...';

  try {
    const posts = await fetchPosts(reset);

    if (reset) {
      if (posts.length === 0) {
        document.getElementById('feed').innerHTML = `
          <div class="empty">
            <h3>No posts found</h3>
            <p>${searchQuery ? 'Try a different search term.' : 'Posts will appear here as BSE announcements come in.'}</p>
          </div>`;
        document.getElementById('stats-text').textContent = '0 posts';
        return;
      }
      document.getElementById('feed').innerHTML = posts.map(renderCard).join('');
    } else {
      document.getElementById('feed').innerHTML += posts.map(renderCard).join('');
    }

    currentPage++;
    document.getElementById('load-more').style.display = allLoaded ? 'none' : 'block';
    document.getElementById('stats-text').textContent = `Showing posts · Updated ${new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}`;

  } catch(e) {
    document.getElementById('error-bar').textContent = 'Failed to load: ' + e.message;
    document.getElementById('error-bar').style.display = 'block';
    document.getElementById('stats-text').textContent = 'Error';
    if (reset) document.getElementById('feed').innerHTML = '';
  }
}

function loadMore() {
  loadPosts(false);
}

// ── SEARCH ──
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchQuery = e.target.value.trim();
  searchTimer = setTimeout(() => loadPosts(true), 400);
});

// ── CATEGORY FILTER ──
document.getElementById('cat-filters').addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeCategory = e.target.dataset.cat;
  loadPosts(true);
});

// ── NIFTY TOGGLE ──
document.getElementById('nifty-toggle').addEventListener('click', () => {
  niftyOnly = !niftyOnly;
  document.getElementById('nifty-toggle').classList.toggle('active', niftyOnly);
  loadPosts(true);
});

// ── AUTO REFRESH every 5 mins ──
setInterval(() => loadPosts(true), 300000);

// ── INIT ──
loadPosts(true);
</script>
</body>
</html>
